[/Script/EnhancedInput.EnhancedInputDeveloperSettings]
; Turns on the engine's per-player key mapping profile. Each Enhanced Input subsystem then creates a
; UEnhancedInputUserSettings, AddMappingContext registers the IMC with it, and RebuildControlMappings applies whatever
; the player has rebound. Nothing in the game has to call it — with this off, the whole rebinding system is inert.
;
; This is what makes TWO KEYS PER ACTION and REBINDING IN THE SETTINGS SCREEN the same feature: mapping rows that share
; a mappable name are handed slot 1, slot 2, ... in the order they appear in the IMC. Only rows whose action (or the row
; itself) carries a PlayerMappableKeySettings are registered at all — see Content/Input/IA_*.
bEnableUserSettings=True

