; Synthwave_city = 맵1(L_Map1_City) 베이스 키트였다. 그 맵은 ADR 0010 으로 기각됐고, 뒤에 남아 있던
; L_Map_1 리다이렉터 껍질도 참조 0 을 확인하고 지웠다(2026-08-21). 키트 자체는 버리지 않는다 —
; 새 아레나 L_Map_1/L_Map_2 가 이 키트의 벽 머티리얼을 재사용하므로 팔레트 등록은 존치한다.
; 루트로 등록 — 팔레트 스캔이 재귀(bRecursivePaths)라 Meshes/Blueprint/Sky_system 을 한 줄로 덮는다.
+PaletteFolders=(Path="/Game/Synthwave_city")
; 250 = Synty CyberCity Base 키트 실측 그리드(Floor/Ceiling 타일 250×250cm; Block 덩어리 1500=6×250로 정합). 2026-07-20 GetBounds 확정.
; Synthwave City 키트 실측(2026-08-11, GetBounds): SM_floor/_02/_03 · SM_road · SM_module_road_02/03/04 이 전부
;   4500×4500cm 정사각, 피벗은 코너. 맵1 지면 격자의 실제 피치도 4500 으로 확인(X=-15410+4500i · Y=-17210+4500j).
;   4500 = 18×250 이라 250 을 그대로 두어도 모듈은 격자에 정확히 얹힌다 — 값 교체 불필요. 대신 프롭(가로등·표지판·차)
;   배치엔 250 이 훨씬 낫다. 45m 모듈만 대량으로 깔 때는 4500 으로 바꾸면 타일링이 무조건 맞는다(모듈↔모듈은
;   SnapRadius 의 면 스냅도 함께 돕는다).
PlacementGridSize=250.000000
RotationSnapDegrees=90.000000
GhostMaterial=/Game/Blockout/M_BlockoutGhost.M_BlockoutGhost


