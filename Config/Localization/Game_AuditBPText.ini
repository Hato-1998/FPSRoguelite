; M0 EC 2 (Roadmap.md 7-6) — BP 인라인 Text 감사 전용 gather 타깃. 출하 Game_Gather.ini와 분리한 이유:
; 에셋 수집(GatherTextFromAssets)을 출하 타깃에 그대로 켜면 2026-08-13 결정으로 제외한 디자인타임
; 플레이스홀더 문자열과 로비 개편 대기 문자열까지 출하 매니페스트·아카이브에 편입돼 번역 의무가 생기고,
; Game_ImportCsvTranslations.ini 커맨드렛(FPSRImportCsvTranslations)의 미스 집계를 흔든다. 이 타깃은
; 감사(탐지) 전용이며 번역 파이프라인(Game_ImportCsvTranslations.ini/Game_Compile.ini)에 관여하지 않는다.
; 키 집합은 엔진 LocalizationConfigurationScript.cpp의 GenerateGatherTextConfigFile이 GatherFromPackages에
; 대해 생성하는 포맷을 그대로 미러한다.
; ShouldGatherFromEditorOnlyData=true인 이유 — 엔진 Runtime/Engine/Private/EdGraph/EdGraphNode.cpp의
; GatherGraphNodeForLocalization이 그래프 핀 DefaultTextValue를 bIsEditorOnly=true로 넘기므로, 이 값이
; false면 BP 그래프 핀의 FText 리터럴이 통째로 누락된다(커맨드렛 필터 = GatherTextFromAssetsCommandlet.cpp:605).
; 실측 2026-08-19: true 68건 / false 62건 — 늘어난 6건은 전부 엔진 에디터 메타데이터였다(위젯 애니메이션
; 트랙 DisplayName 2 + 머티리얼 ChannelNames·Niagara Category·SCS CategoryName 4). 즉 현재 프로젝트에는
; 그래프 핀 FText 리터럴이 없다. 그래도 true로 두는 이유 = 앞으로 생기면 그때 잡히는 쪽이 EC 2의 검사
; 대상 정의("BP 위젯의 인라인 Text")에 맞고, 늘어난 잡음은 검사기가 네임스페이스로 구조적으로 걸러낸다.
; ⚠️ 이 gather로도 못 잡는 것 = FText가 아닌 리터럴(String 핀 기본값 등). WBP_Lobby의 "무기 이름"·"선택중"이
; 그 경우다(에셋에 UTF-16으로 실존하나 매니페스트에 안 나온다) — 로컬라이제이션 gather는 FText만 본다.
; 이 config는 archive를 만들지 않는다(GenerateGatherArchive step 없음) — 번역이 아니라 탐지가 목적이다.
[CommonSettings]
SourcePath=Saved/Localization/BPTextAudit
DestinationPath=Saved/Localization/BPTextAudit
ManifestName=BPTextAudit.manifest
ArchiveName=BPTextAudit.archive
NativeCulture=ko
CulturesToGenerate=ko

[GatherTextStep0]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/*
ExcludePathFilters=Content/Localization/*
ExcludePathFilters=Content/Synty/*
; 주의: 아래는 서드파티 Content/Characters/(복수)다 — 프로젝트 폴더 Content/Character/(단수)와 다른 폴더이며, 단수 쪽은 의도적으로 제외 목록에 없다(오타 아님).
ExcludePathFilters=Content/Characters/*
ExcludePathFilters=Content/PolygonMilitary/*
ExcludePathFilters=Content/StylizedRenderingSystem/*
ExcludePathFilters=Content/Assets/*
ExcludePathFilters=Content/Synthwave_city/*
ExcludePathFilters=Content/ProceduralWeaponAnimationSystem/*
ExcludePathFilters=Content/PolygonCyberCity/*
ExcludePathFilters=Content/LowPolyAnimatedModernGuns/*
ExcludePathFilters=Content/Rifle_01/*
ExcludePathFilters=Content/PolygonScifi/*
ExcludePathFilters=Content/PolygonParticleFX/*
PackageFileNameFilters=*.uasset
PackageFileNameFilters=*.umap
ShouldGatherFromEditorOnlyData=true
SkipGatherCache=true

[GatherTextStep1]
CommandletClass=GenerateGatherManifest
