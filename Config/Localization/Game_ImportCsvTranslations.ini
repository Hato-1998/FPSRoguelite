; LOC0 — Game 로컬라이제이션 타깃: CSV 번역 컬럼(en/ja) → 아카이브 주입.
; CommonSettings는 Game_Gather.ini/Game_Compile.ini와 동일한 매니페스트/아카이브 위치를 가리켜야 커스텀 커맨드렛이
; 같은 FLocTextHelper 저장소를 읽고 쓴다(엔진 GenerateImportTextConfigFile의 CommonSettings 포맷을 미러).
; GatherTextStep0의 CSVFiles/Cultures는 이 커맨드렛만의 전용 키(§5) — 표준 InternationalizationExport(PO)가 아니라
; StringTable CSV의 en/ja 메타데이터 컬럼을 직접 아카이브에 주입하는 이유는 LOC0 §3-1 참조.
[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
NativeCulture=ko
CulturesToGenerate=ko
CulturesToGenerate=en
CulturesToGenerate=ja

[GatherTextStep0]
CommandletClass=FPSRImportCsvTranslations
CSVFiles=StringTables/ST_UI.csv;StringTables/ST_CardEffect.csv;StringTables/ST_Card.csv
Cultures=en,ja
