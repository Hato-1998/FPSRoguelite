; LOC0 — Game 로컬라이제이션 타깃: 소스 매크로 스캔 → 매니페스트/아카이브 기록.
; 키 집합은 엔진 LocalizationConfigurationScript.cpp의 GenerateGatherTextConfigFile이 생성하는 포맷을 그대로 미러한다.
; SearchDirectoryPaths는 Source/FPSRoguelite/ 로만 좁힌다 — Source/FPSRogueliteEditor의 에디터 전용 LOCTEXT
; (검증 메시지·Slate 툴 400+건)는 gather 대상이 아니다(LOC0 §2 비목표). LOCTABLE_FROMFILE_GAME 리터럴 호출 3건이
; 이 디렉터리 안에 있으므로 GatherTextFromSourceCommandlet의 FStringTableFromFileMacroDescriptor가 CSV 3개를
; 발견해 매니페스트에 Key/SourceString을 채운다 — en/ja 번역 컬럼은 이 단계가 아니라 Game_ImportCsvTranslations.ini
; 의 커스텀 커맨드렛이 아카이브에 주입한다.
[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
NativeCulture=ko
CulturesToGenerate=ko
CulturesToGenerate=en
CulturesToGenerate=ja

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source/FPSRoguelite/
ExcludePathFilters=Config/Localization/*
FileNameFilters=*.h
FileNameFilters=*.cpp
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GenerateGatherManifest

[GatherTextStep2]
CommandletClass=GenerateGatherArchive
