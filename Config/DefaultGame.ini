; ── Packaging (P7 §packaging) ───────────────────────────────────────────────────────────────────────────
; The flow travels between maps by NAME (ServerTravel "L_Lobby?listen", config RunMap/LobbyMap, seamless
; TransitionMap), which the cooker can't trace as hard references — so list them explicitly or a packaged build
; boots to the menu then crashes on travel. Gameplay DataAssets (loadout pool, run schedule, cards, missions,
; weapons, boss def) are loaded via config soft paths / AssetManager, also untraceable — always-cook their (small)
; directories. The large /Game/Assets art library is intentionally NOT bulk-cooked: its runtime parts (VAT meshes,
; materials, bone textures) come in as hard dependencies of the enemy/boss/player BPs.
[/Script/UnrealEd.ProjectPackagingSettings]
+MapsToCook=(FilePath="/Game/Maps/L_MainMenu")
+MapsToCook=(FilePath="/Game/Maps/L_Lobby")
+MapsToCook=(FilePath="/Game/Maps/L_Transition")
+MapsToCook=(FilePath="/Game/Maps/L_Arena")
; 아레나 서브레벨은 지속 레벨의 스트리밍 목록에 있으므로 쿠커가 하드 참조로 따라가지만, 이름으로만
; 스트리밍되는 경로(UFPSRArenaStreamSubsystem 의 LoadStreamLevel)도 있어 명시한다.
+MapsToCook=(FilePath="/Game/Maps/L_Map_1")
+MapsToCook=(FilePath="/Game/Maps/L_Map_2")
+DirectoriesToAlwaysCook=(Path="/Game/Cards")
+DirectoriesToAlwaysCook=(Path="/Game/Mission")
+DirectoriesToAlwaysCook=(Path="/Game/Weapons")
+DirectoriesToAlwaysCook=(Path="/Game/Game")
+DirectoriesToAlwaysCook=(Path="/Game/Character")
+DirectoriesToAlwaysCook=(Path="/Game/Actors")
+DirectoriesToAlwaysCook=(Path="/Game/SpawnPoints")
+DirectoriesToAlwaysCook=(Path="/Game/Input")
+DirectoriesToAlwaysCook=(Path="/Game/UI")
; Master SoundClass/SoundMix referenced only via config soft paths (FPSRAudioSettings / AudioSettings) — untraceable, always-cook.
+DirectoriesToAlwaysCook=(Path="/Game/Audio")
; Stage-fade PP material (M_PP_StageFade) referenced only via config soft path (FPSRStageFadeSettings, Phase B) — untraceable, always-cook.
+DirectoriesToAlwaysCook=(Path="/Game/Materials/PostProcess")
; Placeholder scaffold meshes (XP gem / enemy / boss) are referenced ONLY via config soft paths (FPSRPlaceholderVisualSettings)
; and are no longer a hard ConstructorHelpers cook dependency — force-cook the engine BasicShapes so a raw C++ spawn (e.g. the
; XP gem, spawned as the raw class) still finds its LoadSynchronous mesh in packaged builds instead of rendering invisible.
; (Dev scaffolding only; U22 assigns real content-BP meshes, at which point these engine shapes are unreferenced again.)
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")

; ── Localization (LOC0 §4/§9) ───────────────────────────────────────────────────────────────────────────
; StringTable CSVs are read at runtime via LOCTABLE_FROMFILE_GAME (FPSRoguelite.cpp), which loads them straight
; off disk relative to the project Content dir — they are not cooked as normal package content, so the raw CSV
; folder must be force-staged as loose UFS files or a packaged build registers EMPTY tables (the CSV is the only
; source of these strings — every keyed FText resolves to nothing, not to a source-string fallback).
+DirectoriesToAlwaysStageAsUFS=(Path="StringTables")
+CulturesToStage=ko
+CulturesToStage=en
+CulturesToStage=ja
; BaseGame.ini defaults InternationalizationPreset=English, and UAT stages ICU locale data from the preset alone —
; without this override a packaged build ships NO ko/ja ICU data, so culture=ja/ko cannot even be activated there
; (레드팀 P2-2). EFIGSCJK is the smallest engine preset containing en+ja+ko. (BaseGame's DefaultCulture=en is left
; as-is for now — packaged default boots en until a product decision says otherwise.)
InternationalizationPreset=EFIGSCJK

