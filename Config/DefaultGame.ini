; ✅ 원복 완료(2026-08-27) — 관찰용 5m 임시치를 **코드 기본값과 동일한 값으로 되돌렸다**. 임시치는 "LOD 걸린
; 적을 눈으로 보기 위해" 밴드를 5m로 좁혔던 것이고, 그 상태로 성능을 재면 절감이 과대평가된다.
; 값을 지우지 않고 명시적으로 적어 두는 이유: **성능 베이스라인 측정이 어떤 설정에서 나왔는지가 기록으로 남아야**
